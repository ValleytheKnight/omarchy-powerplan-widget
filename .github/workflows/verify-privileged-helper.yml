name: Verify privileged helper

on:
  push:
    paths:
      - powerplan-configure-hibernate
      - packaging/aur/PKGBUILD
      - .github/workflows/verify-privileged-helper.yml
  pull_request:
    paths:
      - powerplan-configure-hibernate
      - packaging/aur/PKGBUILD
      - .github/workflows/verify-privileged-helper.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare PKGBUILD sha256sums against the actual helper digest
        run: |
          set -euo pipefail
          actual="$(sha256sum powerplan-configure-hibernate | cut -d' ' -f1)"
          pinned="$(grep -oP "(?<=sha256sums=\(')[0-9a-f]{64}" packaging/aur/PKGBUILD)"
          if [ "$actual" != "$pinned" ]; then
            echo "sha256sums in packaging/aur/PKGBUILD is stale."
            echo "  pinned: $pinned"
            echo "  actual: $actual"
            echo "Update sha256sums to match the current powerplan-configure-hibernate,"
            echo "and bump pkgver if this is a real change to the helper."
            exit 1
          fi
          echo "PKGBUILD sha256sums matches powerplan-configure-hibernate ($actual)."
