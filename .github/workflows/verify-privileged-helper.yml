name: Verify privileged helper

on:
  push:
    paths:
      - powerplan-configure-hibernate
      - scripts/release-helper
      - packaging/**
      - test/**
      - .github/workflows/verify-privileged-helper.yml
  pull_request:
    paths:
      - powerplan-configure-hibernate
      - scripts/release-helper
      - packaging/**
      - test/**
      - .github/workflows/verify-privileged-helper.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install libarchive-tools for bsdtar
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Compare PKGBUILD sha256sums against the actual helper digest
        run: |
          set -euo pipefail
          actual="$(sha256sum powerplan-configure-hibernate | cut -d' ' -f1)"
          pinned="$(grep -oP "(?<=sha256sums=\(')[0-9a-f]{64}" packaging/pkgbuild/PKGBUILD)"
          if [ "$actual" != "$pinned" ]; then
            echo "sha256sums in packaging/pkgbuild/PKGBUILD is stale."
            echo "  pinned: $pinned"
            echo "  actual: $actual"
            exit 1
          fi
          echo "PKGBUILD sha256sums matches powerplan-configure-hibernate ($actual)."

      - name: Verify every signature in the published pacman repository
        run: |
          set -euo pipefail
          KEY=packaging/keys/valleytheknight-powerplan.asc
          PKG="$(ls packaging/repo/*.pkg.tar.zst)"

          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --import "$KEY"

          # The repository is useless to pacman unless the database and
          # the package are both signed by the same maintainer key.
          for target in "$PKG" packaging/repo/omarchy-powerplan.db packaging/repo/omarchy-powerplan.files; do
            gpg --batch --verify "$target.sig" "$target"
            echo "verified $target"
          done

      - name: Confirm the packaged helper matches the tracked source
        run: |
          set -euo pipefail
          PKG="$(ls packaging/repo/*.pkg.tar.zst)"
          bsdtar -O -xf "$PKG" usr/lib/omarchy-powerplan/powerplan-configure-hibernate > extracted-helper
          if ! cmp -s extracted-helper powerplan-configure-hibernate; then
            echo "The helper inside the published package does not match the tracked"
            echo "powerplan-configure-hibernate. Re-run scripts/release-helper."
            exit 1
          fi
          echo "Published package contents match the tracked helper."

      - name: Confirm the package ships no install scriptlet
        run: |
          set -euo pipefail
          PKG="$(ls packaging/repo/*.pkg.tar.zst)"
          if bsdtar -tf "$PKG" | grep -qx '.INSTALL'; then
            echo "The package contains an .INSTALL scriptlet, which would run as root."
            exit 1
          fi
          echo "No install scriptlet present."

      - name: Confirm the repository database lists the published package
        run: |
          set -euo pipefail
          PKG="$(basename "$(ls packaging/repo/*.pkg.tar.zst)")"
          if ! bsdtar -O -xf packaging/repo/omarchy-powerplan.db | grep -qx "$PKG"; then
            echo "The repository database does not reference $PKG."
            echo "Re-run scripts/release-helper so the database and package agree."
            exit 1
          fi
          echo "Repository database references $PKG."

      - name: Confirm the repository contains no symlinks
        run: |
          set -euo pipefail
          # Marketplace validation rejects a plugin repository containing
          # any symlink, and repo-add creates them by default.
          found="$(git ls-files -s | awk '$1=="120000"{print $4}')"
          if [ -n "$found" ]; then
            echo "Symlinks are not allowed anywhere in this repository:"
            echo "$found"
            exit 1
          fi
          echo "No symlinks tracked."

      - name: Run the test suite
        run: |
          npm test --silent
